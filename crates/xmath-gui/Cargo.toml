[package]
name = "xmath-gui"
description = "xmath desktop application with a Mathcad 15 style interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xmath_gui"
path = "src/lib.rs"

[[bin]]
name = "xmath"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The window application (eframe, native file dialogs). Without it the crate only provides the
# typesetting and PDF export used by the command line tool and the MCP server.
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
xmath-core.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"], optional = true }
egui = "0.31"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"], optional = true }
serde_json.workspace = true
base64 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-writer = "0.15"
ttf-parser = "0.25"
subsetter = "0.2"
flate2 = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
