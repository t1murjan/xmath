[workspace]
resolver = "2"
members = ["crates/xmath-core", "crates/xmath-cli", "crates/xmath-gui", "crates/xmath-mcp"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t1murjan/xmath"
rust-version = "1.80"

[workspace.dependencies]
xmath-core = { path = "crates/xmath-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
